<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAP Commercial License Information</title>
  <style>
    /* Basic Styles */
    body {
      font-family: 'Inter', sans-serif;
      background: #f7fbff;
      color: #212121;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    /* Header */
    header {
      background: linear-gradient(90deg, #fff, #fbfdff);
      padding: 18px 32px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.3px;
    }

    /* Content */
    .container {
      padding: 50px 6vw;
    }

    h1 {
      color: #0b79ff;
      margin-bottom: 20px;
      font-size: 28px;
    }

    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 15px;
    }

    ul {
      font-size: 16px;
      color: #555;
      margin-bottom: 20px;
    }

    li {
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #0b79ff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #666;
      position: absolute;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

</div>

<footer>
  <p>© 2025 EAP. All rights reserved.</p>
</footer>

</body>
</html>
